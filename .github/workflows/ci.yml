name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compila e roda os testes
        run: mvn -B verify

      - name: Guarda os relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Imagem ${{ matrix.module }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - discovery-server
          - api-gateway
          - auth-service
          - restaurant-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # O front tem Dockerfile próprio; os serviços Java compartilham o do backend.
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module == 'frontend' && 'frontend' || 'backend' }}
          build-args: ${{ matrix.module != 'frontend' && format('MODULE={0}', matrix.module) || '' }}
          tags: rota/${{ matrix.module }}:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  compose:
    name: Valida o docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
