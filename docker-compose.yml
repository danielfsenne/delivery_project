name: rota

# Base comum dos serviços Java. Limite de memória por container e JVM enxuta
# (SerialGC, só o compilador C1) para a stack inteira caber numa máquina de desenvolvimento.
x-java-service: &java-service
  mem_limit: 448m
  restart: unless-stopped

x-service-env: &service-env
  DB_HOST: postgres
  DB_USER: ${POSTGRES_USER:-rota}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-rota}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
  EUREKA_URL: http://discovery-server:8761/eureka
  JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k

services:
  postgres:
    image: postgres:16-alpine
    container_name: rota-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rota}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rota-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rota-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rota}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rota}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: discovery-server
    container_name: rota-discovery
    environment:
      JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-gateway:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: api-gateway
    container_name: rota-gateway
    environment: *service-env
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: auth-service
    container_name: rota-auth
    environment: *service-env
    ports:
      - "8181:8181"
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  restaurant-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: restaurant-service
    container_name: rota-restaurant
    environment: *service-env
    ports:
      - "8182:8182"
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: order-service
    container_name: rota-order
    environment: *service-env
    ports:
      - "8183:8183"
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: payment-service
    container_name: rota-payment
    environment: *service-env
    ports:
      - "8184:8184"
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  delivery-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: delivery-service
    container_name: rota-delivery
    environment: *service-env
    ports:
      - "8185:8185"
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
