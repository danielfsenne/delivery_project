name: rota

services:
  postgres:
    image: postgres:16-alpine
    container_name: rota-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rota}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rota-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rota-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rota}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rota}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./backend
      args:
        MODULE: auth-service
    container_name: rota-auth
    environment: &service-env
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-rota}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rota}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy

  restaurant-service:
    build:
      context: ./backend
      args:
        MODULE: restaurant-service
    container_name: rota-restaurant
    environment: *service-env
    ports:
      - "8182:8182"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./backend
      args:
        MODULE: order-service
    container_name: rota-order
    environment:
      <<: *service-env
      RESTAURANT_SERVICE_URL: http://restaurant-service:8182
      PAYMENT_SERVICE_URL: http://payment-service:8184
      DELIVERY_SERVICE_URL: http://delivery-service:8185
    ports:
      - "8183:8183"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: ./backend
      args:
        MODULE: payment-service
    container_name: rota-payment
    environment: *service-env
    ports:
      - "8184:8184"
    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    build:
      context: ./backend
      args:
        MODULE: delivery-service
    container_name: rota-delivery
    environment:
      <<: *service-env
      ORDER_SERVICE_URL: http://order-service:8183
    ports:
      - "8185:8185"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
