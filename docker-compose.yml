name: rota

# Base comum dos serviços Java. Limite de memória por container e JVM enxuta
# (SerialGC, só o compilador C1) para a stack inteira caber numa máquina de desenvolvimento.
x-java-service: &java-service
  mem_limit: 448m
  restart: unless-stopped

# Healthcheck dos serviços Java; cada um define só o comando com a própria porta.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

x-service-env: &service-env
  DB_HOST: postgres
  DB_USER: ${POSTGRES_USER:-rota}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-rota}
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
  EUREKA_URL: http://discovery-server:8761/eureka
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k

services:
  postgres:
    image: postgres:16-alpine
    container_name: rota-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rota}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rota}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rota-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rota-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rota}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rota}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: discovery-server
    container_name: rota-discovery
    environment:
      JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-gateway:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: api-gateway
    container_name: rota-gateway
    environment:
      <<: *service-env
      # Front em desenvolvimento (Vite) e o container do front (nginx).
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: auth-service
    container_name: rota-auth
    environment: *service-env
    ports:
      - "8181:8181"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  restaurant-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: restaurant-service
    container_name: rota-restaurant
    environment: *service-env
    ports:
      - "8182:8182"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8182/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: order-service
    container_name: rota-order
    environment: *service-env
    ports:
      - "8183:8183"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8183/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: payment-service
    container_name: rota-payment
    environment: *service-env
    ports:
      - "8184:8184"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8184/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  delivery-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: delivery-service
    container_name: rota-delivery
    environment: *service-env
    ports:
      - "8185:8185"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8185/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    <<: *java-service
    build:
      context: ./backend
      args:
        MODULE: notification-service
    container_name: rota-notification
    environment:
      <<: *service-env
      MAIL_HOST: mailpit
    ports:
      - "8186:8186"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8186/actuator/health | grep -q UP"]
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # SMTP de desenvolvimento (sucessor do MailHog): captura os e-mails em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: rota-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Observabilidade: métricas (Prometheus), painéis (Grafana) e traces (Jaeger).
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rota-prometheus
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      # Guarda o trace_id junto dos pontos de latência para o Grafana linkar com o Jaeger.
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      discovery-server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rota-grafana
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-rota}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-rota}
      # Painéis abertos para leitura sem login; editar exige o admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rota-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  # Recebe os spans por OTLP (HTTP 4318) e mostra os traces em http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: rota-jaeger
    mem_limit: 256m
    command: ["--memory.max-traces=20000"]
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  postgres-data:
  prometheus-data:
