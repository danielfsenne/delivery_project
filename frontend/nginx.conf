server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve o nome do gateway pelo DNS do Docker a cada requisição, para o nginx
    # subir mesmo que o gateway ainda não esteja no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Os arquivos do build têm hash no nome, então podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do React Router caem no index.html, que não deve ficar em cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
