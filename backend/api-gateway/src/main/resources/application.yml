server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Token bucket no Redis: 20 req/s por usuário (ou IP), com picos de até 40.
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
          # O front chama /api/<recurso>/...; o prefixo /api é removido antes de repassar.
          routes:
            # Cada tentativa custa 6 fichas de um balde de 60 que enche 1 por segundo:
            # 10 tentativas seguidas e depois 1 a cada 6 s (10 por minuto) por IP.
            - id: auth-login
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/login,/api/auth/register
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@loginKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 6
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: restaurants
              uri: lb://restaurant-service
              predicates:
                - Path=/api/restaurants/**
              filters:
                - StripPrefix=1
            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/cart/**,/api/cart,/api/orders/**,/api/orders
              filters:
                - StripPrefix=1
            - id: payments
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
            - id: deliveries
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries/**
              filters:
                - StripPrefix=1
            # WebSocket (STOMP) das notificações em tempo real; o token vai no frame CONNECT.
            - id: realtime
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws,/ws/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
                allowed-headers: "*"
                exposed-headers: X-Request-Id
                max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
