server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # O front chama /api/<recurso>/...; o prefixo /api é removido antes de repassar.
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: restaurants
              uri: lb://restaurant-service
              predicates:
                - Path=/api/restaurants/**
              filters:
                - StripPrefix=1
            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/cart/**,/api/cart,/api/orders/**,/api/orders
              filters:
                - StripPrefix=1
            - id: payments
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
            - id: deliveries
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
                allowed-headers: "*"
                exposed-headers: X-Request-Id
                max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
