server:
  port: 8186

spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:rota}
    password: ${RABBITMQ_PASSWORD:rota}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
  web:
    locale: pt_BR
    locale-resolver: fixed

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  mail:
    from: Rota <pedidos@rota.dev>
  websocket:
    # Origens aceitas no handshake (o front em desenvolvimento roda em localhost:5173).
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
