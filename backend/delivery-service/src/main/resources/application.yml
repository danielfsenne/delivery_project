server:
  port: 8185

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/delivery_db
    username: ${DB_USER:rota}
    password: ${DB_PASSWORD:rota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:rota}
    password: ${RABBITMQ_PASSWORD:rota}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 2
  web:
    locale: pt_BR
    locale-resolver: fixed

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  messaging:
    outbox:
      enabled: true
  delivery:
    # Raio máximo (km) entre o entregador e o restaurante para oferecer uma entrega.
    search-radius-km: 15
    # Ganho mínimo do entregador por corrida, mesmo quando a entrega é grátis para o cliente.
    min-driver-fee: 5.00

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
