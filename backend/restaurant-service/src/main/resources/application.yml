server:
  port: 8182

spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/restaurant_db
    username: ${DB_USER:rota}
    password: ${DB_PASSWORD:rota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:rota}
    password: ${RABBITMQ_PASSWORD:rota}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 2
  web:
    locale: pt_BR
    locale-resolver: fixed

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  timezone: America/Sao_Paulo
  cache:
    catalog-ttl: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
