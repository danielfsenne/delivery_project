server:
  port: 8182

spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/restaurant_db
    username: ${DB_USER:rota}
    password: ${DB_PASSWORD:rota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  timezone: America/Sao_Paulo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
