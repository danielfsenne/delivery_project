server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Instância única: não se registra em si mesma nem busca outros servidores.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Em desenvolvimento os serviços sobem e caem o tempo todo; a autopreservação
    # manteria instâncias mortas no registro.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
