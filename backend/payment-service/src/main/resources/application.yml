server:
  port: 8184

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: ${DB_USER:rota}
    password: ${DB_PASSWORD:rota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed

rota:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  payment:
    # fake: provedor simulado para desenvolvimento. Um provedor real (Mercado Pago, Stripe)
    # seria outra implementação de PaymentProvider ativada por esta propriedade.
    provider: ${PAYMENT_PROVIDER:fake}
    fake:
      card-limit: 500.00

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
