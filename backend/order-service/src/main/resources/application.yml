server:
  port: 8183

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
    username: ${DB_USER:rota}
    password: ${DB_PASSWORD:rota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:rota}
    password: ${RABBITMQ_PASSWORD:rota}
    # Confirmação do broker a cada envio: o outbox só marca como publicado o que chegou.
    publisher-confirm-type: correlated
    listener:
      simple:
        # Falhou em todas as tentativas: a mensagem vai para a DLQ em vez de voltar à fila.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 500ms
          multiplier: 2
  web:
    locale: pt_BR
    locale-resolver: fixed
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

rota:
  timezone: America/Sao_Paulo
  messaging:
    outbox:
      enabled: true
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
  cart:
    ttl: 2d

# Chamadas síncronas para outros serviços. O timeout fica no Feign (acima); aqui,
# retry com backoff para falhas passageiras e circuit breaker para falhas persistentes.
# Só ServiceUnavailableException (rede, 5xx, serviço fora do Eureka) conta como falha.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.rota.common.exception.ServiceUnavailableException
        register-health-indicator: true
    instances:
      restaurant:
        base-config: default
      payment:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.rota.common.exception.ServiceUnavailableException
    instances:
      restaurant:
        base-config: default
      payment:
        base-config: default
        max-attempts: 2

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
